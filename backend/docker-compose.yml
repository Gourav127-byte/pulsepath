version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsepath_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: pulsepath_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsepath_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulsepath}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsepath} -d ${POSTGRES_DB:-pulsepath}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
