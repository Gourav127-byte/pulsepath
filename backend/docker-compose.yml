version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pulsepath_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsepath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsepath_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulsepath}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsepath} -d ${POSTGRES_DB:-pulsepath}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsepath_migrate
    entrypoint: ["/app/scripts/migrate.sh"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-pulsepath}:${POSTGRES_PASSWORD:-pulsepath_secret_password}@db:5432/${POSTGRES_DB:-pulsepath}
      - JWT_SECRET=LOCAL-TEST-DOCKER-SECRET-32BYTES-LONG-VALUE
      - APP_ENV=development
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsepath_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-pulsepath}:${POSTGRES_PASSWORD:-pulsepath_secret_password}@db:5432/${POSTGRES_DB:-pulsepath}
      - JWT_SECRET=LOCAL-TEST-DOCKER-SECRET-32BYTES-LONG-VALUE
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
